# Golden queries for guidance retrieval (Faz 5 exit criterion: recall@3 >= 0.8).
#
# Each query points at a real model-bound group. The expected notes were written by
# reading the group's detection rule titles and events BEFORE retrieval was run
# against it, to keep the labels from being fitted to the ranking. They were still
# written by the same party that wrote the notes: see docs/eval-dataset.md section 3.
#
# Groups without a fitting note in the corpus (for example SAM hive dumping or
# startup-folder persistence) were left out on purpose: a query with no correct
# answer says nothing about recall.
#
# `rule_hint` must appear in one of the group's rule titles. If grouping changes and
# a group id starts pointing elsewhere, the evaluation stops instead of scoring the
# wrong group.

queries:
