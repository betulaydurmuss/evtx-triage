# mshta runs an HTA from C:/Users/Public, which starts rundll32 on a .jpg file as a DLL.
sample: Other/maldoc_mshta_via_shellbrowserwind_rundll32.evtx
csv: maldoc_mshta_via_shellbrowserwind_rundll32.csv
tactic: other
expect_detections: true
key_events_same_group: true
key_events:
- channel: Microsoft-Windows-Sysmon/Operational
  event_id: 1
  fields_contain:
    Image: mshta.exe
    CommandLine: memViewData.hta
- channel: Microsoft-Windows-Sysmon/Operational
  event_id: 1
  fields_contain:
    Image: rundll32.exe
    CommandLine: memViewData.jpg
must_mention_any:
- mshta
- hta
- rundll32
- jpg
- dll
must_not_mention: []
acceptable_assessments:
- likely_malicious
- suspicious
