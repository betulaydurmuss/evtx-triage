# LSASS process clone plus overpass-the-hash style logons.
sample: "Credential Access/tutto_malseclogon.evtx"
csv: "tutto_malseclogon.csv"
tactic: credential-access
expect_detections: true
key_events:
  - channel: Security
    event_id: 4688
    rule_title_contains: "LSASS Process Clone"
  - channel: Security
    event_id: 4624
    rule_title_contains: "Overpass the Hash"
key_events_same_group: true
must_mention_any: ["lsass", "credential", "token", "hash", "logon"]
must_not_mention: ["ransomware"]
acceptable_assessments: [likely_malicious, suspicious]
